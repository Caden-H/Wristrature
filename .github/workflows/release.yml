name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.1.0 (the tag becomes v0.1.0)
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: tools/setup-sdk.sh
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: Build
        run: ./gradlew --stacktrace :app:assembleRelease
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: Release name
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.name }}
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
