name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: tools/setup-sdk.sh
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: Unit tests (core)
        run: ./gradlew --stacktrace :core:test
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: Unit tests (app)
        run: ./gradlew --stacktrace :app:testDebugUnitTest
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: Lint
        run: ./gradlew --stacktrace :app:lintRelease
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: Release APK
        run: ./gradlew --stacktrace :app:assembleRelease
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: Wristrature-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            core/build/reports
            app/build/reports
